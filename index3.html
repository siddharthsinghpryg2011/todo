<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iDraft - Minimalist Task Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              sage: {
                50: "#f4f7f4",
                100: "#e3ebe3",
                200: "#c5d7c5",
                300: "#a3c2a3",
                400: "#81a981",
                500: "#6b8e6b",
                600: "#557255",
                700: "#435a43",
              },
            },
          },
        },
      };
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Flatpickr CSS & JS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

      :root {
        --bg-main: #f8f9fa;
        --bg-card: #ffffff;
        --text-main: #121312;
        --text-muted: #8e8e93;
      }

      .dark {
        --bg-main: #121312;
        --bg-card: #1c1d1b;
        --text-main: #f5f6f4;
        --text-muted: #8e8e93;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Minimal Flatpickr Calendar Styling */
      .flatpickr-calendar {
        background: #ffffff !important;
        border-radius: 1.5rem !important;
        border: 1px solid rgba(0, 0, 0, 0.08) !important;
        box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15) !important;
        font-family: "Plus Jakarta Sans", sans-serif !important;
        padding: 8px !important;
      }
      .dark .flatpickr-calendar {
        background: #1c1d1b !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
      }
      .dark .flatpickr-day {
        color: #f5f6f4 !important;
      }
      .flatpickr-day.selected {
        background: #10b981 !important;
        border-color: #10b981 !important;
        border-radius: 1rem !important;
        font-weight: 700 !important;
        color: white !important;
      }

      @keyframes taskPopIn {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .task-item-anim {
        animation: taskPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .wrap-text-fix {
        overflow-wrap: anywhere;
        word-break: break-word;
        white-space: normal;
      }

      /* Modal Animations */
      .modal-backdrop {
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-card {
        transition:
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-card.slide-down-active {
        transform: translateY(0) scale(1) !important;
        opacity: 1 !important;
      }

      .modal-card.slide-down-hidden {
        transform: translateY(-100%) scale(0.95) !important;
        opacity: 0 !important;
      }

      /* View Animations */
      .view-fade-enter {
        animation: viewSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes viewSlideIn {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .nav-tab-indicator {
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Animated Auth Form Transition Styles */
      .auth-container-transition {
        transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, transform 0.3s ease;
        overflow: hidden;
      }

      .auth-container-hidden {
        max-height: 0px !important;
        opacity: 0 !important;
        transform: translateY(-10px) scale(0.95) !important;
        pointer-events: none;
      }

      .auth-container-visible {
        max-height: 100px !important;
        opacity: 1 !important;
        transform: translateY(0) scale(1) !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white min-h-screen overflow-x-hidden">
    <!-- ================= FRONT AUTH SCREEN ================= -->
    <div id="frontAuthView" class="min-h-screen h-full w-full flex flex-col justify-center items-center p-0 sm:p-4 bg-[#f8f9fa] dark:bg-[#121312] transition-colors">
      <div class="w-full h-full min-h-screen sm:min-h-0 sm:h-auto sm:max-w-md bg-white dark:bg-[#1c1d1b] rounded-none sm:rounded-3xl p-6 sm:p-10 shadow-none sm:shadow-xl border-0 sm:border border-black/5 dark:border-white/5 flex flex-col justify-center items-center relative overflow-y-auto">
        <div class="w-16 h-16 rounded-3xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-extrabold text-3xl mb-4 shrink-0">
          🌸
        </div>

        <h1 id="landingHeading" class="text-xl sm:text-2xl font-extrabold text-slate-800 dark:text-zinc-100 text-center tracking-tight transition-all duration-300">
          Your journey starts here
        </h1>
        <p id="landingSubheading" class="text-xs sm:text-sm font-semibold text-zinc-400 text-center mt-1 mb-6 transition-all duration-300">
          Take the first step
        </p>

        <!-- Toggle Switch Container for Sign In / Create Account -->
        <div class="w-full max-w-xs mb-6 p-1 bg-zinc-100 dark:bg-[#282a27] rounded-2xl flex items-center border border-black/5 dark:border-white/5">
          <button type="button" id="toggleSigninBtn" onclick="setLandingAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-zinc-500 dark:text-zinc-400">
            Sign In
          </button>
          <button type="button" id="toggleSignupBtn" onclick="setLandingAuthMode('signup')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white dark:bg-[#1c1d1b] text-slate-900 dark:text-zinc-100 shadow-sm">
            Create Account
          </button>
        </div>

        <form onsubmit="handleLandingAuthSubmit(event)" class="w-full space-y-3">
          <div id="emailContainer">
            <div class="flex items-center gap-3 px-4 py-3.5 bg-zinc-100 dark:bg-[#282a27] rounded-2xl border border-transparent focus-within:border-emerald-500">
              <i data-lucide="mail" class="w-5 h-5 text-zinc-500 dark:text-zinc-400 shrink-0"></i>
              <input type="email" id="landingEmail" required placeholder="E-mail" class="w-full bg-transparent text-sm font-semibold text-slate-800 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-400 outline-none" />
            </div>
          </div>

          <div id="usernameContainer" class="auth-container-transition auth-container-visible">
            <div class="flex items-center gap-3 px-4 py-3.5 bg-zinc-100 dark:bg-[#282a27] rounded-2xl border border-transparent focus-within:border-emerald-500">
              <i data-lucide="user" class="w-5 h-5 text-zinc-500 dark:text-zinc-400 shrink-0"></i>
              <input type="text" id="landingUsername" placeholder="Username" class="w-full bg-transparent text-sm font-semibold text-slate-800 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-400 outline-none" />
            </div>
          </div>

          <div>
            <div class="flex items-center gap-3 px-4 py-3.5 bg-zinc-100 dark:bg-[#282a27] rounded-2xl border border-transparent focus-within:border-emerald-500">
              <i data-lucide="lock" class="w-5 h-5 text-zinc-500 dark:text-zinc-400 shrink-0"></i>
              <input type="password" id="landingPassword" required placeholder="Password" class="w-full bg-transparent text-sm font-semibold text-slate-800 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-400 outline-none" />
            </div>
          </div>

          <div id="confirmPasswordContainer" class="auth-container-transition auth-container-visible">
            <div class="flex items-center gap-3 px-4 py-3.5 bg-zinc-100 dark:bg-[#282a27] rounded-2xl border border-transparent focus-within:border-emerald-500">
              <i data-lucide="lock" class="w-5 h-5 text-zinc-500 dark:text-zinc-400 shrink-0"></i>
              <input type="password" id="landingConfirmPassword" placeholder="Confirm password" class="w-full bg-transparent text-sm font-semibold text-slate-800 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-400 outline-none" />
            </div>
          </div>

          <div id="landingAuthError" class="text-xs font-semibold text-red-500 hidden text-center bg-red-50 dark:bg-red-950/30 p-3 rounded-2xl mt-2"></div>

          <button type="submit" id="landingSubmitBtn" class="w-full py-3.5 mt-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-base shadow-sm transition-all active:scale-[0.99]">
            Sign up
          </button>
        </form>
      </div>
    </div>

    <!-- ================= MAIN APP DASHBOARD ================= -->
    <!-- Added extra bottom padding (pb-40) to prevent tasks from being obscured by the bottom navigation bar -->
    <div id="appMainView" class="hidden min-h-screen pb-40 md:pb-24 bg-zinc-50 dark:bg-[#121312]">
      <div class="w-full md:px-8 px-4 pt-6 sm:pt-8 flex flex-col gap-6 max-w-full">
        <!-- TOP HEADER -->
        <header class="flex items-center justify-between bg-white dark:bg-[#1c1d1b] p-4 sm:p-6 rounded-3xl border border-black/5 dark:border-white/5 shadow-sm">
          <div class="flex items-center gap-3 sm:gap-4">
            <button onclick="togglePcMenu()" class="hidden md:flex p-2.5 rounded-2xl bg-zinc-100 dark:bg-[#282a27] text-zinc-700 dark:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-[#323531] transition-all border border-black/5 dark:border-white/5" title="Toggle Menu">
              <i data-lucide="menu" class="w-5 h-5"></i>
            </button>

            <div>
              <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-zinc-100">
                My Everyday
              </h1>

              <button id="calendarTriggerBtn" class="inline-flex items-center gap-1.5 mt-1 sm:mt-2 px-3 py-1.5 rounded-xl bg-zinc-100 dark:bg-[#282a27] hover:bg-zinc-200 dark:hover:bg-[#323531] border border-black/5 dark:border-white/5 transition-all text-slate-800 dark:text-zinc-200 cursor-pointer group">
                <i data-lucide="calendar" class="w-4 h-4 text-emerald-500 group-hover:scale-110 transition-transform"></i>
                <span id="displayDateLabel" class="text-xs sm:text-sm font-bold">Select Date</span>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
                <input type="text" id="hiddenDatePicker" class="w-0 h-0 opacity-0 pointer-events-none absolute" />
              </button>
            </div>
          </div>

          <div class="flex items-center gap-2 sm:gap-3">
            <button onclick="toggleTheme()" class="p-2 sm:p-2.5 rounded-2xl bg-zinc-100 dark:bg-[#282a27] text-zinc-700 dark:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-[#323531] transition-all border border-black/5 dark:border-white/5" title="Toggle Theme">
              <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
            </button>
            <div id="topHeaderAuth"></div>
          </div>
        </header>

        <!-- PROGRESS OVERVIEW BAR -->
        <div class="bg-white dark:bg-[#1c1d1b] p-4 sm:p-5 rounded-2xl border border-black/5 dark:border-white/5 shadow-sm space-y-2 w-full">
          <div class="flex items-center justify-between text-xs font-bold text-zinc-400">
            <span>Daily Progress</span>
            <span id="progressPercentText" class="text-emerald-500 font-extrabold">0%</span>
          </div>
          <div class="w-full bg-zinc-100 dark:bg-zinc-800 h-2.5 rounded-full overflow-hidden">
            <div id="progressFill" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- MAIN TASK SECTION -->
        <main id="pageTasks" class="flex flex-col gap-4 w-full view-fade-enter">
          <!-- Category Filters -->
          <div class="flex items-center justify-between pb-1 border-b border-zinc-200 dark:border-zinc-800 w-full">
            <div class="flex gap-4">
              <button onclick="setFilter('all')" id="filterAll" class="text-xs sm:text-sm font-bold text-slate-900 dark:text-zinc-100 pb-2 border-b-2 border-emerald-500">
                All Tasks
              </button>
              <button onclick="setFilter('active')" id="filterActive" class="text-xs sm:text-sm font-bold text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 pb-2">
                Active
              </button>
              <button onclick="setFilter('completed')" id="filterCompleted" class="text-xs sm:text-sm font-bold text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 pb-2">
                Completed
              </button>
            </div>
          </div>

          <!-- TASK LIST CONTAINER -->
          <!-- Added mb-28 so the bottom-most tasks always clear the navigation bar smoothly -->
          <div id="taskListContainer" class="space-y-3 min-h-[160px] w-full mb-28">
            <!-- Dynamic Task Cards Render Here -->
          </div>
        </main>

        <!-- ANALYTICS SECTION -->
        <main id="pageProgress" class="hidden flex-col gap-5 w-full view-fade-enter mb-28">
          <div class="bg-white dark:bg-[#1c1d1b] p-6 rounded-3xl border border-black/5 dark:border-white/5 shadow-sm w-full">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-zinc-400">Overview</span>
            <h2 id="greetingText" class="text-xl font-extrabold mt-1 text-slate-900 dark:text-zinc-100">Hi 👋</h2>

            <div class="grid grid-cols-3 gap-3 my-4">
              <div class="bg-zinc-50 dark:bg-[#282a27] p-4 rounded-2xl text-center">
                <p id="totalTasksCount" class="text-xl font-black text-slate-900 dark:text-zinc-100">0</p>
                <p class="text-[10px] font-bold uppercase text-zinc-400">Total</p>
              </div>
              <div class="bg-zinc-50 dark:bg-[#282a27] p-4 rounded-2xl text-center">
                <p id="pendingCount" class="text-xl font-black text-zinc-400">0</p>
                <p class="text-[10px] font-bold uppercase text-zinc-400">Pending</p>
              </div>
              <div class="bg-zinc-50 dark:bg-[#282a27] p-4 rounded-2xl text-center">
                <p id="completedCount" class="text-xl font-black text-emerald-500">0</p>
                <p class="text-[10px] font-bold uppercase text-zinc-400">Done</p>
              </div>
            </div>
          </div>

          <!-- DUAL BAR CHART -->
          <div class="bg-white dark:bg-[#1c1d1b] p-6 rounded-3xl border border-black/5 dark:border-white/5 shadow-sm w-full">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-extrabold text-slate-900 dark:text-zinc-100">Weekly Activity Bar Chart</h3>
              <div class="flex items-center gap-3 text-[11px] font-bold">
                <span class="flex items-center gap-1 text-emerald-500"><span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span> Done</span>
                <span class="flex items-center gap-1 text-zinc-400"><span class="w-2.5 h-2.5 bg-zinc-400 dark:bg-zinc-600 rounded-full"></span> Pending</span>
              </div>
            </div>
            <div class="w-full h-64 relative">
              <canvas id="growthBarChart"></canvas>
            </div>
          </div>
        </main>
      </div>

      <!-- BOTTOM NAVIGATION BAR WITH ADD TASK BUTTON IN THE CENTER -->
      <div class="fixed bottom-4 left-0 right-0 z-40 flex justify-center px-4 pointer-events-auto">
        <nav class="relative w-full max-w-sm bg-white/95 dark:bg-[#1c1d1b]/95 backdrop-blur-md border border-black/10 dark:border-white/10 p-1.5 rounded-full shadow-2xl flex items-center justify-between">
          
          <button onclick="switchPage('tasks', 0)" id="navTasksBtn" class="relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-bold text-xs transition-all active:scale-95">
            <i data-lucide="list" class="w-4 h-4"></i>
            <span>Tasks</span>
          </button>

          <!-- CENTERED ADD TASK BUTTON -->
          <button onclick="openAddTaskModal()" class="relative z-20 shrink-0 p-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-lg transition-transform active:scale-90 flex items-center justify-center mx-1" title="Add Task">
            <i data-lucide="plus" class="w-5 h-5 stroke-[2.5]"></i>
          </button>

          <button onclick="switchPage('progress', 1)" id="navProgressBtn" class="relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-zinc-400 font-bold text-xs transition-all active:scale-95">
            <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
            <span>Analytics</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- PC SIDEBAR DRAWER -->
    <div id="pcSidebar" class="fixed inset-0 z-50 hidden">
      <div onclick="togglePcMenu()" class="absolute inset-0 bg-black/40 backdrop-blur-xs"></div>
      <div class="absolute top-0 left-0 bottom-0 w-72 bg-white dark:bg-[#1c1d1b] border-r border-black/10 dark:border-white/10 p-6 shadow-2xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-8 pb-4 border-b border-zinc-100 dark:border-zinc-800">
            <h2 class="text-lg font-extrabold text-slate-900 dark:text-zinc-100">Menu Navigation</h2>
            <button onclick="togglePcMenu()" class="text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <div class="space-y-2">
            <button onclick="switchPage('tasks', 0); togglePcMenu();" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-zinc-100 dark:bg-[#282a27] text-slate-900 dark:text-zinc-100 font-bold text-sm text-left hover:bg-emerald-500/10 transition-colors">
              <i data-lucide="list" class="w-5 h-5 text-emerald-500"></i> To-Do Tasks
            </button>
            <button onclick="switchPage('progress', 1); togglePcMenu();" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-zinc-100 dark:bg-[#282a27] text-slate-900 dark:text-zinc-100 font-bold text-sm text-left hover:bg-emerald-500/10 transition-colors">
              <i data-lucide="bar-chart-2" class="w-5 h-5 text-emerald-500"></i> Analytics Overview
            </button>
          </div>
        </div>

        <div class="pt-4 border-t border-zinc-100 dark:border-zinc-800">
          <p class="text-xs font-semibold text-zinc-400">iDraft Dashboard v2.0</p>
        </div>
      </div>
    </div>

    <!-- ADD TASK MODAL -->
    <div id="addTaskModal" class="fixed inset-0 z-50 hidden flex items-start justify-center p-4">
      <div id="addTaskBackdrop" onclick="closeAddTaskModal()" class="modal-backdrop absolute inset-0 bg-black/40 backdrop-blur-md opacity-0"></div>

      <div id="addTaskCard" class="modal-card slide-down-hidden w-full max-w-md bg-white dark:bg-[#1c1d1b] p-6 rounded-3xl shadow-2xl border border-black/5 dark:border-white/5 relative mt-8 z-10">
        <div class="flex items-center justify-between pb-3 border-b border-zinc-100 dark:border-zinc-800 mb-4">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-zinc-100 flex items-center gap-2">
            <i data-lucide="check-square" class="w-5 h-5 text-emerald-500"></i> Create New Task
          </h3>
          <button onclick="closeAddTaskModal()" class="text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 transition-all">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form onsubmit="handleAddTask(event)" class="space-y-4">
          <div class="space-y-1">
            <label class="text-xs font-bold text-zinc-400">Task Title</label>
            <div class="flex items-center gap-2 bg-zinc-50 dark:bg-[#282a27] p-3 rounded-2xl border border-zinc-200 dark:border-zinc-800">
              <input type="text" id="taskInput" placeholder="What needs to be done?" class="w-full bg-transparent text-slate-900 dark:text-zinc-100 text-sm font-semibold outline-none placeholder-zinc-400" />
              <button type="button" onclick="startSpeechRecognition('taskInput')" class="p-1.5 hover:bg-zinc-200 dark:hover:bg-[#323531] rounded-xl text-zinc-400 transition-all shrink-0" title="Voice Input">
                <i data-lucide="mic" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeAddTaskModal()" class="w-1/2 py-3 rounded-2xl bg-zinc-100 dark:bg-[#282a27] text-zinc-600 dark:text-zinc-300 font-bold text-sm transition-all">
              Cancel
            </button>
            <button type="submit" class="w-1/2 py-3 rounded-2xl bg-slate-900 dark:bg-zinc-100 text-white dark:text-slate-900 font-bold text-sm shadow-sm transition-all active:scale-95">
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- EDIT TASK MODAL -->
    <div id="editTaskModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
      <div class="w-full max-w-sm bg-white dark:bg-[#1c1d1b] p-6 rounded-3xl shadow-2xl border border-black/5 dark:border-white/5 relative z-50">
        <button onclick="closeEditTaskModal()" class="absolute top-5 right-5 text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <h3 class="text-base font-extrabold text-slate-900 dark:text-zinc-100 text-center">Edit Task</h3>

        <form onsubmit="handleSaveTaskEdit(event)" class="space-y-4 mt-5">
          <input type="hidden" id="editTaskId" />
          <div>
            <label class="text-xs font-bold text-zinc-400 mb-1 block">Title</label>

    <!-- APPLICATION SCRIPT -->
    <script>
      const SUPABASE_URL = "https://odpprhelxplixtlgqwpr.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcHByaGVseHBsaXh0bGdxd3ByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzgxMzgsImV4cCI6MjEwMDExNDEzOH0.KEG9sZnTPFR8dJ2RSQuA3XS7kcZfqQ44eIdTtf4DM1A";

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        { auth: { persistSession: true, autoRefreshToken: true } },
      );

      let currentUser = null;
      let landingAuthMode = "signup";
      let currentFilter = "all";
      let selectedDate = new Date().toISOString().split("T")[0];
      let tasksList = [];
      let barChartInstance = null;
      let flatpickrInstance = null;

      function initTheme() {
        const savedTheme = localStorage.getItem("theme");
        if (
          savedTheme === "dark" ||
          (!savedTheme &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
          updateThemeIcon(true);
        } else {
          document.documentElement.classList.remove("dark");
          updateThemeIcon(false);
        }
      }

      function toggleTheme() {
        triggerVibration();
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateThemeIcon(isDark);
        if (barChartInstance) fetchGrowthData();
      }

      function updateThemeIcon(isDark) {
        const icon = document.getElementById("themeIcon");
        if (icon) {
          icon.setAttribute("data-lucide", isDark ? "sun" : "moon");
          lucide.createIcons();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        initTheme();
        lucide.createIcons();
        initCalendarPicker();
        initBarChart();
        checkSession();

        // Close 3-dot dropdown action menus when clicking outside
        document.addEventListener("click", (e) => {
          if (!e.target.closest('.action-menu-container')) {
            closeAllActionMenus();
          }
        });
      });

      /* Calendar Initialization */
      function initCalendarPicker() {
        flatpickrInstance = flatpickr("#hiddenDatePicker", {
          defaultDate: selectedDate,
          dateFormat: "Y-m-d",
          disableMobile: "true",
          onChange: function (selectedDates, dateStr) {
            if (dateStr) {
              selectedDate = dateStr;
              updateDateLabel(dateStr);
              fetchTasks();
            }
          },
        });

        document.getElementById("calendarTriggerBtn").addEventListener("click", () => {
          flatpickrInstance.open();
        });

        updateDateLabel(selectedDate);
      }

      function updateDateLabel(dateStr) {
        const todayStr = new Date().toISOString().split("T")[0];
        const label = document.getElementById("displayDateLabel");

        if (dateStr === todayStr) {
          label.innerText = "Today";
        } else {
          const d = new Date(dateStr + "T00:00:00");
          label.innerText = d.toLocaleDateString("en-US", {
            weekday: "short",
            month: "short",
            day: "numeric",
          });
        }
      }

      function openAddTaskModal() {
        triggerVibration();
        const modal = document.getElementById("addTaskModal");
        const backdrop = document.getElementById("addTaskBackdrop");
        const card = document.getElementById("addTaskCard");

        modal.classList.remove("hidden");

        requestAnimationFrame(() => {
          backdrop.style.opacity = "1";
          card.classList.remove("slide-down-hidden");
          card.classList.add("slide-down-active");
        });

        setTimeout(() => {
          document.getElementById("taskInput").focus();
        }, 150);
      }

      function closeAddTaskModal() {
        const modal = document.getElementById("addTaskModal");
        const backdrop = document.getElementById("addTaskBackdrop");
        const card = document.getElementById("addTaskCard");

        backdrop.style.opacity = "0";
        card.classList.remove("slide-down-active");
        card.classList.add("slide-down-hidden");

        setTimeout(() => {
          modal.classList.add("hidden");
          document.getElementById("taskInput").value = "";
        }, 300);
      }

      function togglePcMenu() {
        const sidebar = document.getElementById("pcSidebar");
        sidebar.classList.toggle("hidden");
      }

      /* Animated Segment Toggle Mode Switch */
      function setLandingAuthMode(mode) {
        triggerVibration();
        landingAuthMode = mode;

        const usernameContainer = document.getElementById("usernameContainer");
        const confirmPasswordContainer = document.getElementById("confirmPasswordContainer");
        const heading = document.getElementById("landingHeading");
        const subheading = document.getElementById("landingSubheading");
        const submitBtn = document.getElementById("landingSubmitBtn");
        const errorContainer = document.getElementById("landingAuthError");
        
        const signinBtn = document.getElementById("toggleSigninBtn");
        const signupBtn = document.getElementById("toggleSignupBtn");

        errorContainer.classList.add("hidden");

        if (landingAuthMode === "login") {
          usernameContainer.classList.remove("auth-container-visible");
          usernameContainer.classList.add("auth-container-hidden");
          confirmPasswordContainer.classList.remove("auth-container-visible");
          confirmPasswordContainer.classList.add("auth-container-hidden");

          heading.innerText = "Welcome back";
          subheading.innerText = "Sign in to continue";
          submitBtn.innerText = "Sign in";

          signinBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white dark:bg-[#1c1d1b] text-slate-900 dark:text-zinc-100 shadow-sm";
          signupBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-zinc-500 dark:text-zinc-400";
        } else {
          usernameContainer.classList.remove("auth-container-hidden");
          usernameContainer.classList.add("auth-container-visible");
          confirmPasswordContainer.classList.remove("auth-container-hidden");
          confirmPasswordContainer.classList.add("auth-container-visible");

          heading.innerText = "Your journey starts here";
          subheading.innerText = "Take the first step";
          submitBtn.innerText = "Sign up";

          signupBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white dark:bg-[#1c1d1b] text-slate-900 dark:text-zinc-100 shadow-sm";
          signinBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-zinc-500 dark:text-zinc-400";
        }
      }

      async function handleLandingAuthSubmit(e) {
        e.preventDefault();
        triggerVibration();

        const email = document.getElementById("landingEmail").value.trim();
        const username = document.getElementById("landingUsername").value.trim();
        const password = document.getElementById("landingPassword").value;
        const confirmPassword = document.getElementById("landingConfirmPassword").value;
        const errorContainer = document.getElementById("landingAuthError");

        errorContainer.classList.add("hidden");

        try {
          if (landingAuthMode === "signup") {
            if (password !== confirmPassword) {
              throw new Error("Passwords do not match.");
            }
            const { data, error } = await supabaseClient.auth.signUp({
              email,
              password,
              options: { data: { full_name: username || email.split("@")[0] } },
            });
            if (error) throw error;
            if (data?.user && !data?.session) {
              alert("Confirmation email sent! Please check your inbox.");
            }
          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({
              email,
              password,
            });
            if (error) throw error;
          }
        } catch (err) {
          errorContainer.innerText = err.message || "Authentication failed.";
          errorContainer.classList.remove("hidden");
        }
      }

      async function checkSession() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        currentUser = session?.user || null;
        updateViewVisibility();
      }

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        currentUser = session?.user || null;
        updateViewVisibility();
      });

      function updateViewVisibility() {
        const frontAuthView = document.getElementById("frontAuthView");
        const appMainView = document.getElementById("appMainView");

        if (currentUser) {
          frontAuthView.classList.add("hidden");
          appMainView.classList.remove("hidden");
          updateUIForUser();
          fetchTasks();
        } else {
          frontAuthView.classList.remove("hidden");
          appMainView.classList.add("hidden");
          tasksList = [];
        }
      }

      function updateUIForUser() {
        const topHeaderAuth = document.getElementById("topHeaderAuth");
        const greetingText = document.getElementById("greetingText");

        if (currentUser) {
          const userName =
            currentUser.user_metadata?.full_name ||
            currentUser.email.split("@")[0];
          if (greetingText) greetingText.innerText = `Hi, ${userName}! 👋`;

          topHeaderAuth.innerHTML = `
            <div class="flex items-center gap-2">
              <button onclick="openProfileModal()" class="w-8 h-8 rounded-full bg-slate-900 dark:bg-zinc-100 text-white dark:text-slate-900 font-extrabold text-xs flex items-center justify-center shadow-xs hover:scale-105 transition-transform">
                ${userName.charAt(0).toUpperCase()}
              </button>
              <button onclick="handleLogout()" class="p-1.5 sm:p-2 text-zinc-400 hover:text-red-500 transition-all" title="Log Out">
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          `;
        }
        lucide.createIcons();
      }

      async function handleLogout() {
        triggerVibration();
        await supabaseClient.auth.signOut();
      }

      function switchPage(page, tabIndex) {
        triggerVibration();
        const pageTasks = document.getElementById("pageTasks");
        const pageProgress = document.getElementById("pageProgress");
        const navTasksBtn = document.getElementById("navTasksBtn");
        const navProgressBtn = document.getElementById("navProgressBtn");

        if (page === "tasks") {
          pageTasks.classList.remove("hidden");
          pageTasks.classList.add("flex");
          pageProgress.classList.add("hidden");
          pageProgress.classList.remove("flex");

          navTasksBtn.className =
            "relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-bold text-xs transition-all active:scale-95";
          navProgressBtn.className =
            "relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-zinc-400 font-bold text-xs transition-all active:scale-95";
        } else {
          pageTasks.classList.add("hidden");
          pageTasks.classList.remove("flex");
          pageProgress.classList.remove("hidden");
          pageProgress.classList.add("flex");

          navTasksBtn.className =
            "relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-zinc-400 font-bold text-xs transition-all active:scale-95";
          navProgressBtn.className =
            "relative z-10 flex-1 py-2.5 flex items-center justify-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-bold text-xs transition-all active:scale-95";

          fetchGrowthData();
        }
      }

      function triggerVibration() {
        try {
          if ("vibrate" in navigator) navigator.vibrate(25);
        } catch (err) {}
      }

      async function fetchTasks() {
        if (!currentUser) return;
        const { data, error } = await supabaseClient
          .from("tasks")
          .select("*")
          .eq("date", selectedDate)
          .order("created_at", { ascending: false });

        if (!error) {
          tasksList = data || [];
          renderTasks();
        }
      }

      async function handleAddTask(e) {
        e.preventDefault();
        triggerVibration();
        const input = document.getElementById("taskInput");
        const title = input.value.trim();

        if (!title || !currentUser) return;

        try {
          const { data, error } = await supabaseClient
            .from("tasks")
            .insert([
              {
                user_id: currentUser.id,
                title,
                completed: false,
                date: selectedDate,
              },
            ])
            .select();

          if (!error && data && data.length > 0) {
            tasksList.unshift(data[0]);
            closeAddTaskModal();
            renderTasks();
          }
        } catch (err) {
          alert("Error adding task: " + err.message);
        }
      }

      async function toggleTask(id, currentCompletedState) {
        triggerVibration();
        const newStatus = !currentCompletedState;
        const target = tasksList.find((x) => x.id === id);

        if (target) {
          target.completed = newStatus;
          renderTasks();
        }

        const { error } = await supabaseClient
          .from("tasks")
          .update({ completed: newStatus })
          .eq("id", id);

        if (error && target) {
          target.completed = currentCompletedState;
          renderTasks();
        }
      }

      async function deleteTask(id) {
        triggerVibration();
        closeAllActionMenus();
        const { error } = await supabaseClient
          .from("tasks")
          .delete()
          .eq("id", id);
        if (!error) {
          tasksList = tasksList.filter((x) => x.id !== id);
          renderTasks();
        }
      }

      /* 3-DOT MENU CLIPPING FIX VIA Z-INDEX & CONTAINMENT */
      function toggleActionMenu(event, id) {
        event.stopPropagation();
        triggerVibration();

        const targetMenu = document.getElementById(`actionMenu-${id}`);
        const cardParent = document.getElementById(`taskCard-${id}`);
        const isHidden = targetMenu.classList.contains("hidden");

        closeAllActionMenus();

        if (isHidden) {
          targetMenu.classList.remove("hidden");
          cardParent.style.zIndex = "40"; // Elevated z-index over subsequent cards
        }
      }

      function closeAllActionMenus() {
        document.querySelectorAll('.action-menu-dropdown').forEach(menu => {
          menu.classList.add('hidden');
        });
        document.querySelectorAll('.task-card-item').forEach(card => {
          card.style.zIndex = "1";
        });
      }

      function renderTasks() {
        const container = document.getElementById("taskListContainer");
        const filtered = tasksList.filter((t) => {
          if (currentFilter === "active") return !t.completed;
          if (currentFilter === "completed") return t.completed;
          return true;
        });

        const total = tasksList.length;
        const done = tasksList.filter((t) => t.completed).length;
        const pending = total - done;
        const percent = total > 0 ? Math.round((done / total) * 100) : 0;

        document.getElementById("progressPercentText").innerText = `${percent}%`;
        document.getElementById("progressFill").style.width = `${percent}%`;

        if (document.getElementById("totalTasksCount")) {
          document.getElementById("totalTasksCount").innerText = total;
          document.getElementById("completedCount").innerText = done;
          document.getElementById("pendingCount").innerText = pending;
        }

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 text-zinc-400 space-y-2 bg-white dark:bg-[#1c1d1b] rounded-3xl border border-black/5 dark:border-white/5 w-full">
              <i data-lucide="check-circle-2" class="w-8 h-8 mx-auto stroke-1 text-zinc-300 dark:text-zinc-600"></i>
              <p class="text-xs font-semibold">No tasks found for this date</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        /* 
           UPDATED RENDER: 
           Completed task cards receive 'bg-zinc-50 dark:bg-[#181917] opacity-50' to make completed tasks duller visually.
        */
        container.innerHTML = filtered
          .map(
            (t) => `
          <div id="taskCard-${t.id}" class="task-card-item task-item-anim relative p-3.5 sm:p-4 rounded-2xl ${t.completed ? "bg-zinc-50 dark:bg-[#181917] opacity-50 border-black/5 dark:border-white/5" : "bg-white dark:bg-[#1c1d1b] border-black/5 dark:border-white/5"} border flex items-center justify-between gap-3 shadow-xs hover:border-black/10 transition-all w-full z-1">
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
              <button onclick="toggleTask('${t.id}', ${t.completed})" class="shrink-0">
                <div class="w-6 h-6 rounded-full border-2 ${t.completed ? "border-emerald-500 bg-emerald-500 text-white" : "border-zinc-300 dark:border-zinc-600"} flex items-center justify-center transition-all">
                  ${t.completed ? `<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>` : ""}
                </div>
              </button>
              <span class="text-xs sm:text-sm font-semibold wrap-text-fix ${t.completed ? "line-through text-zinc-400 dark:text-zinc-500" : "text-slate-800 dark:text-zinc-100"}">${t.title}</span>
            </div>
            
            <div class="relative shrink-0 action-menu-container">
              <button onclick="toggleActionMenu(event, '${t.id}')" class="p-1.5 sm:p-2 text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-100 rounded-xl transition-all">
                <i data-lucide="more-vertical" class="w-4 h-4"></i>
              </button>

              <div id="actionMenu-${t.id}" class="action-menu-dropdown hidden absolute right-0 top-9 sm:top-10 w-36 bg-white dark:bg-[#282a27] border border-black/10 dark:border-white/10 rounded-2xl shadow-xl z-50 p-1 space-y-1">
                <button onclick="openEditTaskModal('${t.id}', '${t.title.replace(/'/g, "\\'")}')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-[#323531] transition-all">
                  <i data-lucide="pencil" class="w-3.5 h-3.5 text-emerald-500"></i> Edit
                </button>
                <button onclick="deleteTask('${t.id}')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
                </button>
              </div>
            </div>
          </div>
        `,
          )
          .join("");

        lucide.createIcons();
      }

      function setFilter(filter) {
        triggerVibration();
        currentFilter = filter;
        ["All", "Active", "Completed"].forEach((f) => {
          const btn = document.getElementById(`filter${f}`);
          if (f.toLowerCase() === filter) {
            btn.className =
              "text-xs sm:text-sm font-bold text-slate-900 dark:text-zinc-100 pb-2 border-b-2 border-emerald-500";
          } else {
            btn.className =
              "text-xs sm:text-sm font-bold text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 pb-2";
          }
        });
        renderTasks();
      }

      function openEditTaskModal(id, title) {
        closeAllActionMenus();
        document.getElementById("editTaskId").value = id;
        document.getElementById("editTaskTitle").value = title;
        document.getElementById("editTaskModal").classList.remove("hidden");
      }

      function closeEditTaskModal() {
        document.getElementById("editTaskModal").classList.add("hidden");
      }

      async function handleSaveTaskEdit(e) {
        e.preventDefault();
        const id = document.getElementById("editTaskId").value;
        const newTitle = document.getElementById("editTaskTitle").value.trim();

        if (!newTitle) return;

        const { error } = await supabaseClient
          .from("tasks")
          .update({ title: newTitle })
          .eq("id", id);

        if (!error) {
          const task = tasksList.find((t) => t.id === id);
          if (task) task.title = newTitle;
          renderTasks();
          closeEditTaskModal();
        }
      }

      function openProfileModal() {
        if (!currentUser) return;
        document.getElementById("editProfileName").value =
          currentUser.user_metadata?.full_name || "";
        document.getElementById("editProfileEmail").value =
          currentUser.email || "";
        document.getElementById("profileModal").classList.remove("hidden");
      }

      function closeProfileModal() {
        document.getElementById("profileModal").classList.add("hidden");
      }

      async function handleProfileUpdate(e) {
        e.preventDefault();
        const newName = document.getElementById("editProfileName").value.trim();
        if (!newName) return;

        const { data, error } = await supabaseClient.auth.updateUser({
          data: { full_name: newName },
        });

        if (!error) {
          currentUser = data.user;
          updateUIForUser();
          closeProfileModal();
        }
      }

      function initBarChart() {
        const ctx = document.getElementById("growthBarChart");
        if (!ctx) return;

        barChartInstance = new Chart(ctx.getContext("2d"), {
          type: "bar",
          data: {
            labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
            datasets: [
              {
                label: "Completed",
                data: [0, 0, 0, 0, 0, 0, 0],
                backgroundColor: "#10b981",
                borderRadius: 6,
              },
              {
                label: "Pending",
                data: [0, 0, 0, 0, 0, 0, 0],
                backgroundColor: "#9ca3af",
                borderRadius: 6,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: "#8e8e93" } },
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1, color: "#8e8e93" },
              },
            },
          },
        });
      }

      async function fetchGrowthData() {
        if (!currentUser || !barChartInstance) return;
        const today = new Date();
        let completedCounts = [];
        let pendingCounts = [];
        let labels = [];

        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split("T")[0];
          labels.push(d.toLocaleDateString("en-US", { weekday: "short" }));

          const { data } = await supabaseClient
            .from("tasks")
            .select("*")
            .eq("user_id", currentUser.id)
            .eq("date", dateStr);

          const total = data ? data.length : 0;
          const completed = data ? data.filter((t) => t.completed).length : 0;
          const pending = total - completed;

          completedCounts.push(completed);
          pendingCounts.push(pending);
        }

        const isDark = document.documentElement.classList.contains("dark");
        barChartInstance.data.labels = labels;
        barChartInstance.data.datasets[0].data = completedCounts;
        barChartInstance.data.datasets[1].data = pendingCounts;
        barChartInstance.data.datasets[1].backgroundColor = isDark
          ? "#4b5563"
          : "#9ca3af";
        barChartInstance.update();
      }

      function startSpeechRecognition(targetInputId = 'taskInput') {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition)
          return alert("Speech recognition is not supported in this browser.");
        
        const recognition = new SpeechRecognition();
        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          const inputElem = document.getElementById(targetInputId);
          if (inputElem) {
            inputElem.value = transcript;
          }
        };
        recognition.start();
      }
    </script>
  </body>
</html>
